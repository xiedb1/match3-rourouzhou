<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>肉肉消消乐</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Microsoft YaHei', sans-serif;
  background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  color: #fff;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  overscroll-behavior: none;
}

h1 {
  margin: 20px 0 10px;
  font-size: 36px;
  background: linear-gradient(90deg, #e94560, #f5a623, #7ed957, #4fc3f7, #ab47bc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* 状态栏 */
.hud {
  display: flex;
  gap: 20px;
  margin-bottom: 12px;
  background: rgba(255,255,255,0.08);
  padding: 10px 20px;
  border-radius: 15px;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1);
  flex-wrap: wrap;
  justify-content: center;
}

.hud-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 60px;
}

.hud-label { font-size: 11px; color: rgba(255,255,255,0.6); margin-bottom: 3px; }
.hud-value { font-size: 22px; font-weight: bold; }
.hud-value.score { color: #f5a623; }
.hud-value.level { color: #7ed957; }
.hud-value.moves { color: #4fc3f7; }

/* 目标栏 */
.objectives {
  display: flex;
  gap: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
  justify-content: center;
}

.obj-item {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(255,255,255,0.1);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 16px;
  font-weight: bold;
}

.obj-icon {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: bold;
}

.obj-done { opacity: 0.4; text-decoration: line-through; }

/* 棋盘 */
.board-wrap {
  position: relative;
  padding: 12px;
  background: rgba(255,255,255,0.05);
  border-radius: 20px;
  border: 2px solid rgba(255,255,255,0.1);
  box-shadow: 0 0 40px rgba(0,0,0,0.4);
}

#board {
  --tile-size: 56px;
  --gap: 4px;
  display: grid;
  grid-template-columns: repeat(8, var(--tile-size));
  grid-template-rows: repeat(8, var(--tile-size));
  gap: var(--gap);
  position: relative;
}

/* 方块 */
.tile {
  width: var(--tile-size);
  height: var(--tile-size);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: calc(var(--tile-size) * 0.45);
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s, opacity 0.3s;
  position: relative;
}

.tile.selected {
  transform: scale(1.15);
  box-shadow: 0 0 0 3px #fff, 0 0 20px rgba(255,255,255,0.6);
  z-index: 10;
}

.tile.removing { transform: scale(0); opacity: 0; }

.tile .icon-small { font-size: calc(var(--tile-size) * 0.4); margin-right: 2px; }

/* 名字颜色 */
.tile.color-0 { background: linear-gradient(135deg, #e94560, #c72a40); color: #fff; }
.tile.color-1 { background: linear-gradient(135deg, #4dabf7, #228be6); color: #fff; }
.tile.color-2 { background: linear-gradient(135deg, #ffe066, #fab005); color: #333; }
.tile.color-3 { background: linear-gradient(135deg, #ff922b, #f76707); color: #fff; }

/* 特殊方块 */
.tile.special-rocket-h {
  box-shadow: inset 0 0 0 3px rgba(255,255,255,0.8), 0 0 15px rgba(100,200,255,0.6);
  animation: glow 1s infinite;
}
.tile.special-rocket-v {
  box-shadow: inset 0 0 0 3px rgba(255,255,255,0.8), 0 0 15px rgba(100,255,200,0.6);
  animation: glow 1s infinite;
}
.tile.special-plane {
  box-shadow: inset 0 0 0 3px rgba(255,255,255,0.8), 0 0 15px rgba(255,200,100,0.6);
  animation: pulse 1s infinite;
}
.tile.special-bomb {
  box-shadow: inset 0 0 0 3px rgba(255,255,255,0.8), 0 0 20px rgba(255,100,100,0.7);
  animation: pulse 1s infinite;
}
.tile.special-rainbow {
  background: conic-gradient(#e94560, #4dabf7, #ffe066, #ff922b, #e94560) !important;
  animation: spin 2s linear infinite;
}

/* 障碍物 */
.tile.obstacle-lock::after {
  content: '🔒';
  position: absolute;
  font-size: calc(var(--tile-size) * 0.4);
  filter: drop-shadow(0 0 3px rgba(0,0,0,0.8));
}
.tile.obstacle-box {
  background: linear-gradient(135deg, #8b6914, #a07820) !important;
  color: transparent;
}
.tile.obstacle-box::after {
  content: '📦';
  position: absolute;
  font-size: calc(var(--tile-size) * 0.4);
}
.tile.obstacle-cookie {
  background: linear-gradient(135deg, #d4a574, #b8860b) !important;
}
.tile.obstacle-cookie::after {
  content: '🍪';
  position: absolute;
  font-size: calc(var(--tile-size) * 0.45);
}
.tile.obstacle-damaged {
  opacity: 0.6;
  filter: brightness(0.7);
}

@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
@keyframes glow {
  0%,100% { box-shadow: inset 0 0 0 3px rgba(255,255,255,0.5), 0 0 8px rgba(255,255,255,0.4); }
  50% { box-shadow: inset 0 0 0 3px rgba(255,255,255,1), 0 0 20px rgba(255,255,255,0.7); }
}
@keyframes spin { from{filter:hue-rotate(0deg)} to{filter:hue-rotate(360deg)} }

/* 连击/特效文字 */
.effect-text {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 42px;
  font-weight: bold;
  color: #f5a623;
  text-shadow: 0 0 25px rgba(245,166,35,0.8), 0 0 8px rgba(0,0,0,0.6);
  pointer-events: none;
  z-index: 100;
  animation: effectShow 1.2s ease-out forwards;
  white-space: nowrap;
}
@keyframes effectShow {
  0% { transform: translate(-50%,-50%) scale(0.3); opacity: 0; }
  25% { transform: translate(-50%,-50%) scale(1.2); opacity: 1; }
  70% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
  100% { transform: translate(-50%,-50%) scale(1.4); opacity: 0; }
}

/* 彩蛋遮罩 */
.easter-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.85);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 999;
  pointer-events: none;
  opacity: 0;
  animation: easterFade 4.5s ease-out forwards;
}

@keyframes easterFade {
  0% { opacity: 0; }
  8% { opacity: 1; }
  90% { opacity: 1; }
  100% { opacity: 0; }
}

.easter-heart {
  font-size: 120px;
  animation: heartBeat 1s ease-in-out infinite;
  filter: drop-shadow(0 0 30px rgba(255,100,150,0.8));
  opacity: 1;
}

@keyframes heartBeat {
  0%, 100% { transform: scale(1); }
  25% { transform: scale(1.15); }
  50% { transform: scale(0.95); }
  75% { transform: scale(1.1); }
}

.easter-names {
  font-size: 36px;
  font-weight: bold;
  margin-top: 20px;
  display: flex;
  gap: 15px;
  opacity: 0;
  animation: nameRise 0.8s ease-out 0.3s forwards;
}

@keyframes nameRise {
  0% { transform: translateY(30px); opacity: 0; }
  100% { transform: translateY(0); opacity: 1; }
}

.easter-names .name {
  text-shadow: 0 0 15px currentColor, 0 0 5px rgba(0,0,0,0.8);
  animation: nameGlow 2s ease-in-out infinite;
}

@keyframes nameGlow {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.4); }
}

.easter-subtitle {
  font-size: 20px;
  color: rgba(255,255,255,0.9);
  margin-top: 15px;
  opacity: 0;
  animation: nameRise 0.8s ease-out 0.8s forwards;
}

/* 撒花粒子 */
.confetti {
  position: fixed;
  width: 10px;
  height: 10px;
  z-index: 998;
  pointer-events: none;
  animation: confettiFall 3s linear forwards;
}

@keyframes confettiFall {
  0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* 飞机飞行动画 */
.plane-fly {
  position: absolute;
  font-size: 28px;
  z-index: 80;
  pointer-events: none;
  animation: planeFly 0.6s ease-in forwards;
}
@keyframes planeFly {
  0% { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(0.3) translate(var(--dx), var(--dy)); }
}

/* 分数飘字 */
.score-pop {
  position: absolute;
  font-size: 16px;
  font-weight: bold;
  color: #fff;
  text-shadow: 0 0 6px rgba(0,0,0,0.8);
  pointer-events: none;
  z-index: 50;
  animation: scorePop 0.8s ease-out forwards;
}
@keyframes scorePop {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-35px); opacity: 0; }
}

/* 弹窗 */
.overlay {
  position: fixed; top:0; left:0; right:0; bottom:0;
  background: rgba(0,0,0,0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
}
.overlay.active { display: flex; }
.modal {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  padding: 35px 50px;
  border-radius: 20px;
  text-align: center;
  border: 2px solid rgba(255,255,255,0.15);
  box-shadow: 0 0 50px rgba(233,69,96,0.3);
  max-width: 90vw;
}
.modal h2 { font-size: 28px; margin-bottom: 12px; }
.modal p { font-size: 16px; color: rgba(255,255,255,0.7); margin-bottom: 20px; }
.modal .stats { font-size: 18px; margin-bottom: 20px; }
.modal button {
  padding: 10px 35px; font-size: 18px;
  border: none; border-radius: 12px;
  background: linear-gradient(135deg, #e94560, #f5a623);
  color: #fff; cursor: pointer; font-weight: bold;
  transition: transform 0.2s;
}
.modal button:hover { transform: scale(1.05); }

.hint {
  margin-top: 12px;
  font-size: 12px;
  color: rgba(255,255,255,0.4);
  text-align: center;
  padding: 0 15px;
  max-width: 500px;
  line-height: 1.6;
}

/* 移动端 */
@media (max-width: 500px) {
  h1 { font-size: 26px; margin: 12px 0 8px; }
  .hud { gap: 10px; padding: 8px 12px; }
  .hud-item { min-width: 50px; }
  .hud-label { font-size: 9px; }
  .hud-value { font-size: 18px; }
  .obj-item { font-size: 13px; padding: 4px 10px; }
  .obj-icon { width: 22px; height: 22px; font-size: 13px; }
  .board-wrap { padding: 8px; border-radius: 14px; }
  .hint { font-size: 11px; }
  .effect-text { font-size: 30px; }
  .modal { padding: 25px 30px; }
  .modal h2 { font-size: 22px; }
  .modal button { padding: 8px 25px; font-size: 16px; }
}
@media (max-width: 380px) {
  h1 { font-size: 22px; }
  .hud { gap: 6px; padding: 6px; }
  .hud-value { font-size: 16px; }
}
</style>
</head>
<body>

<h1>肉肉消消乐</h1>

<div class="hud">
  <div class="hud-item"><span class="hud-label">关卡</span><span class="hud-value level" id="level">1</span></div>
  <div class="hud-item"><span class="hud-label">分数</span><span class="hud-value score" id="score">0</span></div>
  <div class="hud-item"><span class="hud-label">步数</span><span class="hud-value moves" id="moves">20</span></div>
</div>

<div class="objectives" id="objectives"></div>

<div class="board-wrap"><div id="board"></div></div>

<p class="hint">
  4连一线→火箭🚀 ｜ 田字形2×2→纸飞机✈️ ｜ 5连L/T形→炸弹💣 ｜ 5连一线→彩虹球🌈<br>
  特殊方块交换即引爆 ｜ 两个特殊方块交换产生组合效果
</p>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modal-title">恭喜过关！</h2>
    <p id="modal-desc"></p>
    <div class="stats" id="modal-stats"></div>
    <button id="modal-btn">下一关</button>
  </div>
</div>

<script>
// ===================== 配置 =====================
const ROWS = 8, COLS = 8;
const NAMES = ['谢', '汐', '周', '肉'];
const COLORS = NAMES.length;

const TYPE_NORMAL = 'normal';
const TYPE_ROCKET_H = 'rocket-h';   // 火箭横
const TYPE_ROCKET_V = 'rocket-v';   // 火箭竖
const TYPE_PLANE = 'plane';         // 纸飞机
const TYPE_BOMB = 'bomb';           // 炸弹
const TYPE_RAINBOW = 'rainbow';     // 彩虹球

const OBSTACLE_NONE = null;
const OBSTACLE_LOCK = 'lock';       // 锁链：需消除2次
const OBSTACLE_BOX = 'box';         // 箱子：需相邻消除3次
const OBSTACLE_COOKIE = 'cookie';   // 饼干：需相邻消除1次

// ===================== 状态 =====================
let board = [];
let score = 0, moves = 20, level = 1;
let combo = 0;
let selected = null;
let processing = false;
let objectives = []; // [{type:'color', color:0, need:8, done:0} | {type:'obstacle', need:5, done:0}]

const boardEl = document.getElementById('board');
const overlayEl = document.getElementById('overlay');

// ===================== 关卡生成 =====================
const LEVELS = [
  { moves: 20, objs: [{type:'color', color:0, need:8}, {type:'color', color:1, need:8}], obstacles: [] },
  { moves: 22, objs: [{type:'color', color:2, need:10}, {type:'color', color:3, need:10}], obstacles: [{type:OBSTACLE_LOCK, count:4}] },
  { moves: 25, objs: [{type:'color', color:0, need:12}, {type:'color', color:2, need:12}], obstacles: [{type:OBSTACLE_BOX, count:3}] },
  { moves: 25, objs: [{type:'color', color:1, need:10}, {type:'color', color:3, need:10}, {type:'obstacle', need:6}], obstacles: [{type:OBSTACLE_COOKIE, count:6}] },
  { moves: 28, objs: [{type:'color', color:0, need:15}, {type:'color', color:1, need:15}, {type:'color', color:2, need:15}], obstacles: [{type:OBSTACLE_LOCK, count:5}, {type:OBSTACLE_BOX, count:3}] },
];

function getLevelConfig(lv) {
  if (lv <= LEVELS.length) return LEVELS[lv - 1];
  // 随机生成更高关卡
  return {
    moves: 25 + lv,
    objs: [
      {type:'color', color: lv % COLORS, need: 10 + lv * 2},
      {type:'color', color: (lv+1) % COLORS, need: 10 + lv * 2},
      {type:'obstacle', need: 5 + lv},
    ],
    obstacles: [{type: OBSTACLE_BOX, count: 4 + lv % 3}, {type: OBSTACLE_LOCK, count: 3 + lv % 3}]
  };
}

function init() {
  const cfg = getLevelConfig(level);
  moves = cfg.moves;

  board = [];
  for (let r = 0; r < ROWS; r++) {
    const row = [];
    for (let c = 0; c < COLS; c++) {
      let color;
      do {
        color = Math.floor(Math.random() * COLORS);
      } while (
        (c >= 2 && row[c-1].color === color && row[c-2].color === color) ||
        (r >= 2 && board[r-1][c].color === color && board[r-2][c].color === color)
      );
      row.push({ color, type: TYPE_NORMAL, obstacle: OBSTACLE_NONE, hp: 0 });
    }
    board.push(row);
  }

  // 放置障碍物
  for (const ob of cfg.obstacles) {
    let placed = 0;
    while (placed < ob.count) {
      const r = Math.floor(Math.random() * ROWS);
      const c = Math.floor(Math.random() * COLS);
      if (board[r][c].obstacle === OBSTACLE_NONE) {
        board[r][c].obstacle = ob.type;
        board[r][c].hp = ob.type === OBSTACLE_LOCK ? 2 : (ob.type === OBSTACLE_BOX ? 3 : 1);
        placed++;
      }
    }
  }

  // 设置目标
  objectives = cfg.objs.map(o => {
    if (o.type === 'color') return {type:'color', color:o.color, need:o.need, done:0};
    if (o.type === 'obstacle') return {type:'obstacle', need:o.need, done:0};
  });

  score = 0;
  combo = 0;
  selected = null;
  processing = false;
  render();
  updateHUD();
  renderObjectives();
}

// ===================== 渲染 =====================
function render() {
  boardEl.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const tile = board[r][c];
      const el = document.createElement('div');
      el.className = `tile color-${tile.color}`;
      if (tile.type !== TYPE_NORMAL) el.classList.add(`special-${tile.type}`);
      if (tile.obstacle !== OBSTACLE_NONE) {
        el.classList.add(`obstacle-${tile.obstacle}`);
        if (tile.hp <= 1 && tile.obstacle !== OBSTACLE_COOKIE) el.classList.add('obstacle-damaged');
      }
      el.dataset.r = r; el.dataset.c = c;
      el.innerHTML = getTileIcon(tile);
      el.addEventListener('click', () => handleClick(r, c));
      tile.el = el;
      boardEl.appendChild(el);
    }
  }
}

// ===================== 滑动手势 =====================
let swipeStart = null;
const SWIPE_THRESHOLD = 20; // 滑动阈值（像素）

function getTilePos(el) {
  const r = parseInt(el.dataset.r);
  const c = parseInt(el.dataset.c);
  return { r, c };
}

// 获取方块元素中心坐标
function getTileCenter(el) {
  const rect = el.getBoundingClientRect();
  return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
}

// 从坐标找到对应方块
function getTileAtPoint(x, y) {
  const rect = boardEl.getBoundingClientRect();
  const styles = getComputedStyle(boardEl);
  const ts = parseFloat(styles.getPropertyValue('--tile-size'));
  const gap = parseFloat(styles.getPropertyValue('--gap'));
  const pad = 12; // board-wrap padding
  const localX = x - rect.left;
  const localY = y - rect.top;
  const step = ts + gap;
  const c = Math.floor(localX / step);
  const r = Math.floor(localY / step);
  if (r >= 0 && r < ROWS && c >= 0 && c < COLS) return { r, c };
  return null;
}

function onSwipeStart(x, y) {
  if (processing) return;
  const pos = getTileAtPoint(x, y);
  if (!pos) return;
  if (board[pos.r][pos.c].obstacle === OBSTACLE_BOX) return;
  swipeStart = { x, y, r: pos.r, c: pos.c };
}

function onSwipeEnd(x, y) {
  if (!swipeStart || processing) { swipeStart = null; return; }
  const dx = x - swipeStart.x;
  const dy = y - swipeStart.y;
  const absDx = Math.abs(dx);
  const absDy = Math.abs(dy);

  // 滑动距离不够，当作点击处理
  if (absDx < SWIPE_THRESHOLD && absDy < SWIPE_THRESHOLD) {
    swipeStart = null;
    return; // 让click事件处理
  }

  let targetR = swipeStart.r;
  let targetC = swipeStart.c;

  if (absDx > absDy) {
    // 水平滑动
    targetC += dx > 0 ? 1 : -1;
  } else {
    // 垂直滑动
    targetR += dy > 0 ? 1 : -1;
  }

  // 边界检查
  if (targetR < 0 || targetR >= ROWS || targetC < 0 || targetC >= COLS) {
    swipeStart = null;
    return;
  }

  // 清除选中状态
  if (selected) {
    board[selected.r][selected.c].el.classList.remove('selected');
    selected = null;
  }

  const r1 = swipeStart.r, c1 = swipeStart.c;
  swipeStart = null;
  trySwap(r1, c1, targetR, targetC);
}

// 触屏事件
boardEl.addEventListener('touchstart', (e) => {
  if (e.touches.length > 0) {
    const t = e.touches[0];
    onSwipeStart(t.clientX, t.clientY);
  }
}, { passive: true });

boardEl.addEventListener('touchend', (e) => {
  if (e.changedTouches.length > 0) {
    const t = e.changedTouches[0];
    onSwipeEnd(t.clientX, t.clientY);
  }
}, { passive: true });

// 鼠标事件（PC端滑动）
let mouseDown = false;
boardEl.addEventListener('mousedown', (e) => {
  mouseDown = true;
  onSwipeStart(e.clientX, e.clientY);
});

boardEl.addEventListener('mouseup', (e) => {
  if (mouseDown) {
    mouseDown = false;
    onSwipeEnd(e.clientX, e.clientY);
  }
});

boardEl.addEventListener('mouseleave', () => {
  if (mouseDown) { mouseDown = false; swipeStart = null; }
});

function getTileIcon(tile) {
  // 有障碍物的方块显示障碍物图标（CSS::after处理），底层名字隐藏
  if (tile.obstacle !== OBSTACLE_NONE) {
    if (tile.type !== TYPE_NORMAL) {
      // 特殊方块被障碍物覆盖时仍显示特殊标记
      return getSpecialIcon(tile.type, tile.color);
    }
    return '';
  }
  return getSpecialIcon(tile.type, tile.color) || NAMES[tile.color];
}

function getSpecialIcon(type, color) {
  if (type === TYPE_ROCKET_H) return '<span class="icon-small">🚀</span>';
  if (type === TYPE_ROCKET_V) return '<span class="icon-small">🚀</span>';
  if (type === TYPE_PLANE) return '<span class="icon-small">✈️</span>';
  if (type === TYPE_BOMB) return '<span class="icon-small">💣</span>';
  if (type === TYPE_RAINBOW) return '<span class="icon-small">🌈</span>';
  return '';
}

function updateHUD() {
  document.getElementById('score').textContent = score;
  document.getElementById('moves').textContent = moves;
  document.getElementById('level').textContent = level;
}

function renderObjectives() {
  const el = document.getElementById('objectives');
  el.innerHTML = '';
  for (const obj of objectives) {
    const div = document.createElement('div');
    div.className = 'obj-item';
    if (obj.done >= obj.need) div.classList.add('obj-done');
    if (obj.type === 'color') {
      div.innerHTML = `<div class="obj-icon tile color-${obj.color}">${NAMES[obj.color]}</div>${obj.done}/${obj.need}`;
    } else {
      div.innerHTML = `<div class="obj-icon">📦</div>${obj.done}/${obj.need}`;
    }
    el.appendChild(div);
  }
}

// ===================== 点击处理 =====================
function handleClick(r, c) {
  if (processing) return;
  if (board[r][c].obstacle === OBSTACLE_BOX) return; // 箱子不能直接交换

  if (!selected) {
    selected = { r, c };
    board[r][c].el.classList.add('selected');
    return;
  }
  if (selected.r === r && selected.c === c) {
    board[r][c].el.classList.remove('selected');
    selected = null;
    return;
  }
  const dr = Math.abs(selected.r - r);
  const dc = Math.abs(selected.c - c);
  if (dr + dc !== 1) {
    board[selected.r][selected.c].el.classList.remove('selected');
    selected = { r, c };
    board[r][c].el.classList.add('selected');
    return;
  }
  const from = selected;
  board[from.r][from.c].el.classList.remove('selected');
  selected = null;
  trySwap(from.r, from.c, r, c);
}

// ===================== 交换 =====================
async function trySwap(r1, c1, r2, c2) {
  processing = true;
  const t1 = board[r1][c1], t2 = board[r2][c2];
  const isSp1 = t1.type !== TYPE_NORMAL;
  const isSp2 = t2.type !== TYPE_NORMAL;

  // 两个特殊方块组合
  if (isSp1 && isSp2) {
    moves--;
    combo = 0;
    await handleSpecialCombo(r1, c1, r2, c2);
    await processChain();
    updateHUD();
    renderObjectives();
    checkLevelEnd();
    processing = false;
    return;
  }

  // 彩虹 + 普通
  if (t1.type === TYPE_RAINBOW || t2.type === TYPE_RAINBOW) {
    moves--;
    combo = 0;
    const rbPos = t1.type === TYPE_RAINBOW ? [r1,c1] : [r2,c2];
    const otherPos = t1.type === TYPE_RAINBOW ? [r2,c2] : [r1,c1];
    const targetColor = board[otherPos[0]][otherPos[1]].color;
    const toRemove = new Set([`${rbPos[0]},${rbPos[1]}`]);
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        if (board[r][c].color === targetColor && board[r][c].obstacle === OBSTACLE_NONE)
          toRemove.add(`${r},${c}`);
    score += toRemove.size * 15;
    showEffect('彩色消除！');
    await removeAndCascade(toRemove);
    await processChain();
    updateHUD(); renderObjectives();
    checkLevelEnd();
    processing = false;
    return;
  }

  // 特殊方块 + 普通 → 引爆
  if (isSp1 || isSp2) {
    const spPos = isSp1 ? [r1,c1] : [r2,c2];
    moves--; combo = 0;
    const toRemove = new Set();
    triggerSpecial(spPos[0], spPos[1], toRemove);
    score += toRemove.size * 10;
    await removeAndCascade(toRemove);
    await processChain();
    updateHUD(); renderObjectives();
    checkLevelEnd();
    processing = false;
    return;
  }

  // 普通交换
  swapTiles(r1, c1, r2, c2);
  render();
  await sleep(200);
  const matches = findMatches();
  if (matches.length === 0) {
    swapTiles(r1, c1, r2, c2);
    render();
    await sleep(200);
    processing = false;
    return;
  }
  moves--; combo = 0;
  await processChain();
  updateHUD(); renderObjectives();
  checkLevelEnd();
  processing = false;
}

function swapTiles(r1, c1, r2, c2) {
  const tmp = board[r1][c1];
  board[r1][c1] = board[r2][c2];
  board[r2][c2] = tmp;
}

// ===================== 匹配检测（支持L/T形）=====================
function findMatches() {
  const hMatches = [];
  const vMatches = [];

  // 横向检测：逐行扫描连续同色段
  for (let r = 0; r < ROWS; r++) {
    let c = 0;
    while (c < COLS) {
      // 跳过障碍物和特殊方块
      if (board[r][c].obstacle !== OBSTACLE_NONE || board[r][c].type !== TYPE_NORMAL) {
        c++;
        continue;
      }
      const color = board[r][c].color;
      let end = c + 1;
      while (end < COLS && board[r][end].color === color
        && board[r][end].type === TYPE_NORMAL
        && board[r][end].obstacle === OBSTACLE_NONE) {
        end++;
      }
      if (end - c >= 3) {
        const tiles = [];
        for (let k = c; k < end; k++) tiles.push([r, k]);
        hMatches.push({ tiles, dir: 'h', count: end - c, color });
      }
      c = end;
    }
  }

  // 纵向检测
  for (let c = 0; c < COLS; c++) {
    let r = 0;
    while (r < ROWS) {
      if (board[r][c].obstacle !== OBSTACLE_NONE || board[r][c].type !== TYPE_NORMAL) {
        r++;
        continue;
      }
      const color = board[r][c].color;
      let end = r + 1;
      while (end < ROWS && board[end][c].color === color
        && board[end][c].type === TYPE_NORMAL
        && board[end][c].obstacle === OBSTACLE_NONE) {
        end++;
      }
      if (end - r >= 3) {
        const tiles = [];
        for (let k = r; k < end; k++) tiles.push([k, c]);
        vMatches.push({ tiles, dir: 'v', count: end - r, color });
      }
      r = end;
    }
  }

  // 先检测田字形（2×2正方形），优先级最高
  const squareMatches = [];
  const usedBySquare = new Set();
  for (let r = 0; r < ROWS - 1; r++) {
    for (let c = 0; c < COLS - 1; c++) {
      const t00 = board[r][c], t01 = board[r][c+1], t10 = board[r+1][c], t11 = board[r+1][c+1];
      if (!t00 || !t01 || !t10 || !t11) continue;
      if (t00.obstacle !== OBSTACLE_NONE || t01.obstacle !== OBSTACLE_NONE ||
          t10.obstacle !== OBSTACLE_NONE || t11.obstacle !== OBSTACLE_NONE) continue;
      if (t00.type !== TYPE_NORMAL || t01.type !== TYPE_NORMAL ||
          t10.type !== TYPE_NORMAL || t11.type !== TYPE_NORMAL) continue;
      if (t00.color === t01.color && t00.color === t10.color && t00.color === t11.color) {
        const tiles = [[r,c],[r,c+1],[r+1,c],[r+1,c+1]];
        squareMatches.push({ tiles, dir: 'square', count: 4, color: t00.color });
        for (const t of tiles) usedBySquare.add(`${t[0]},${t[1]}`);
      }
    }
  }

  // 过滤掉被田字形包含的横向/纵向匹配
  const hMatchFiltered = hMatches.filter(m => !m.tiles.some(t => usedBySquare.has(`${t[0]},${t[1]}`)));
  const vMatchFiltered = vMatches.filter(m => !m.tiles.some(t => usedBySquare.has(`${t[0]},${t[1]}`)));

  // 检测L/T形交叉（在田字形之后）
  const result = [...squareMatches];
  const usedH = new Set(), usedV = new Set();

  for (let i = 0; i < hMatchFiltered.length; i++) {
    for (let j = 0; j < vMatchFiltered.length; j++) {
      if (hMatchFiltered[i].color !== vMatchFiltered[j].color) continue;
      const hSet = new Set(hMatchFiltered[i].tiles.map(t => `${t[0]},${t[1]}`));
      const vSet = new Set(vMatchFiltered[j].tiles.map(t => `${t[0]},${t[1]}`));
      let cross = null;
      for (const t of hMatchFiltered[i].tiles) {
        if (vSet.has(`${t[0]},${t[1]}`)) { cross = t; break; }
      }
      if (cross) {
        const allTiles = [...hMatchFiltered[i].tiles, ...vMatchFiltered[j].tiles];
        const uniqueTiles = [...new Set(allTiles.map(t => `${t[0]},${t[1]}`))].map(s => s.split(',').map(Number));
        result.push({ tiles: uniqueTiles, dir: 'lt', count: uniqueTiles.length, color: hMatchFiltered[i].color, cross });
        usedH.add(i); usedV.add(j);
      }
    }
  }

  for (let i = 0; i < hMatchFiltered.length; i++) {
    if (!usedH.has(i)) result.push(hMatchFiltered[i]);
  }
  for (let j = 0; j < vMatchFiltered.length; j++) {
    if (!usedV.has(j)) result.push(vMatchFiltered[j]);
  }

  return result;
}

// ===================== 消除连锁 =====================
async function processChain() {
  while (true) {
    const matches = findMatches();
    if (matches.length === 0) break;

    combo++;
    if (combo >= 2) showEffect(`${combo}连击！`);

    const toRemove = new Set();
    const specialsToCreate = [];

    for (const m of matches) {
      const baseScore = m.count * 10;
      const gained = baseScore * (combo > 1 ? combo : 1);
      score += gained;

      // 统计颜色消除数量（用于目标）
      for (const [r, c] of m.tiles) {
        const tile = board[r][c];
        if (tile.obstacle === OBSTACLE_NONE) {
          for (const obj of objectives) {
            if (obj.type === 'color' && obj.color === tile.color && obj.done < obj.need) obj.done++;
          }
        }
      }

      // 生成特殊方块
      const mid = m.tiles[Math.floor(m.tiles.length / 2)];
      if (m.dir === 'square') {
        // 田字形 → 纸飞机
        specialsToCreate.push({ r: mid[0], c: mid[1], color: m.color, type: TYPE_PLANE });
      } else if (m.dir === 'lt') {
        // L/T形
        if (m.count >= 5) {
          specialsToCreate.push({ r: mid[0], c: mid[1], color: m.color, type: TYPE_BOMB });
        }
        // 4连L/T形不生成道具（梦幻家园里L/T 5连才给炸弹）
      } else {
        // 纯线形
        if (m.count >= 5) {
          specialsToCreate.push({ r: mid[0], c: mid[1], color: m.color, type: TYPE_RAINBOW });
        } else if (m.count === 4) {
          const rocketType = m.dir === 'h' ? TYPE_ROCKET_H : TYPE_ROCKET_V;
          specialsToCreate.push({ r: mid[0], c: mid[1], color: m.color, type: rocketType });
        }
      }

      for (const [r, c] of m.tiles) toRemove.add(`${r},${c}`);
    }

    // 分数飘字
    if (matches.length > 0) {
      const m0 = matches[0];
      const [r, c] = m0.tiles[Math.floor(m0.tiles.length / 2)];
      const total = matches.reduce((s, m) => s + m.count * 10 * (combo > 1 ? combo : 1), 0);
      showScorePop(r, c, total);
    }

    // 特殊方块引爆
    const expanded = expandSpecials(toRemove);

    // 从消除集合中移除特殊方块生成位置，确保它们不被清除
    for (const sp of specialsToCreate) {
      expanded.delete(`${sp.r},${sp.c}`);
      toRemove.delete(`${sp.r},${sp.c}`); // 确保原始集合也不含
    }

    await removeAndCascade(expanded, specialsToCreate);
    updateHUD();
    renderObjectives();
  }
}

function expandSpecials(toRemove) {
  const result = new Set(toRemove);
  const queue = [...toRemove];
  while (queue.length > 0) {
    const [r, c] = queue.shift().split(',').map(Number);
    const tile = board[r][c];
    if (!tile) continue;
    triggerSingle(r, c, result, queue);
  }
  return result;
}

function triggerSingle(r, c, result, queue) {
  const tile = board[r][c];
  if (!tile) return;
  if (tile.type === TYPE_BOMB) {
    for (let dr = -1; dr <= 1; dr++)
      for (let dc = -1; dc <= 1; dc++) {
        const nr = r+dr, nc = c+dc;
        if (nr>=0&&nr<ROWS&&nc>=0&&nc<COLS) {
          const key = `${nr},${nc}`;
          if (!result.has(key)) { result.add(key); queue.push(key); }
        }
      }
  } else if (tile.type === TYPE_ROCKET_H) {
    for (let i = 0; i < COLS; i++) {
      const key = `${r},${i}`;
      if (!result.has(key)) { result.add(key); queue.push(key); }
    }
  } else if (tile.type === TYPE_ROCKET_V) {
    for (let i = 0; i < ROWS; i++) {
      const key = `${i},${c}`;
      if (!result.has(key)) { result.add(key); queue.push(key); }
    }
  } else if (tile.type === TYPE_PLANE) {
    // 纸飞机：飞向随机目标 + 消除周围
    const targets = findPlaneTargets(r, c, 1);
    result.add(`${r},${c}`);
    for (const [tr, tc] of targets) {
      result.add(`${tr},${tc}`);
      // 飞机还炸周围1格
      for (let dr=-1;dr<=1;dr++)
        for (let dc=-1;dc<=1;dc++) {
          const nr=tr+dr, nc=tc+dc;
          if (nr>=0&&nr<ROWS&&nc>=0&&nc<COLS) {
            const key=`${nr},${nc}`;
            if (!result.has(key)) { result.add(key); queue.push(key); }
          }
        }
    }
  }
}

function triggerSpecial(r, c, toRemove) {
  const tile = board[r][c];
  if (!tile || tile.type === TYPE_NORMAL) return;
  toRemove.add(`${r},${c}`);
  const queue = [`${r},${c}`];
  while (queue.length > 0) {
    const [cr, cc] = queue.shift().split(',').map(Number);
    triggerSingle(cr, cc, toRemove, queue);
  }
}

// 纸飞机找目标：优先找障碍物，其次随机
function findPlaneTargets(r, c, count) {
  const targets = [];
  // 找障碍物
  for (let tr = 0; tr < ROWS; tr++)
    for (let tc = 0; tc < COLS; tc++)
      if (board[tr][tc].obstacle !== OBSTACLE_NONE)
        targets.push([tr, tc]);
  // 没有障碍物则找随机
  if (targets.length === 0) {
    for (let i = 0; i < count; i++) {
      targets.push([Math.floor(Math.random()*ROWS), Math.floor(Math.random()*COLS)]);
    }
  }
  return targets.slice(0, count);
}

// ===================== 10种道具组合 =====================
async function handleSpecialCombo(r1, c1, r2, c2) {
  const t1 = board[r1][c1], t2 = board[r2][c2];
  const types = new Set([t1.type, t2.type]);
  const toRemove = new Set();

  // 辅助：统计消除的颜色和障碍物
  function trackRemoval(key) {
    const [r, c] = key.split(',').map(Number);
    const tile = board[r][c];
    if (!tile) return;
    if (tile.obstacle === OBSTACLE_NONE) {
      for (const obj of objectives) {
        if (obj.type === 'color' && obj.color === tile.color && obj.done < obj.need) obj.done++;
      }
    }
  }

  // 彩虹 + 彩虹 → 全屏清除 + 彩蛋
  if (types.has(TYPE_RAINBOW) && types.has(TYPE_RAINBOW)) {
    showEasterEgg();
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++) {
        toRemove.add(`${r},${c}`);
        trackRemoval(`${r},${c}`);
      }
    score += toRemove.size * 20;
    showEffect('全屏清除！');
    await sleep(800);
    await removeAndCascade(toRemove);
    return;
  }

  // 彩虹 + 火箭 → 全场同色变火箭再引爆
  if (types.has(TYPE_RAINBOW) && (types.has(TYPE_ROCKET_H) || types.has(TYPE_ROCKET_V))) {
    const otherType = t1.type === TYPE_RAINBOW ? t2.type : t1.type;
    const otherColor = t1.type === TYPE_RAINBOW ? t2.color : t1.color;
    toRemove.add(`${r1},${c1}`); toRemove.add(`${r2},${c2}`);
    trackRemoval(`${r1},${c1}`); trackRemoval(`${r2},${c2}`);
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++) {
        const tile = board[r][c];
        if (tile.color === otherColor && tile.obstacle === OBSTACLE_NONE) {
          if (otherType === TYPE_ROCKET_H) {
            for (let i = 0; i < COLS; i++) {
              const key = `${r},${i}`;
              if (!toRemove.has(key)) { toRemove.add(key); trackRemoval(key); }
            }
          } else {
            for (let i = 0; i < ROWS; i++) {
              const key = `${i},${c}`;
              if (!toRemove.has(key)) { toRemove.add(key); trackRemoval(key); }
            }
          }
        }
      }
    score += toRemove.size * 15;
    showEffect('彩色火箭！');
    await removeAndCascade(toRemove);
    return;
  }

  // 彩虹 + 炸弹 → 全场同色变炸弹再引爆
  if (types.has(TYPE_RAINBOW) && types.has(TYPE_BOMB)) {
    const otherColor = t1.type === TYPE_RAINBOW ? t2.color : t1.color;
    toRemove.add(`${r1},${c1}`); toRemove.add(`${r2},${c2}`);
    trackRemoval(`${r1},${c1}`); trackRemoval(`${r2},${c2}`);
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++) {
        if (board[r][c].color === otherColor && board[r][c].obstacle === OBSTACLE_NONE) {
          for (let dr = -1; dr <= 1; dr++)
            for (let dc = -1; dc <= 1; dc++) {
              const nr = r+dr, nc = c+dc;
              if (nr>=0&&nr<ROWS&&nc>=0&&nc<COLS) {
                const key = `${nr},${nc}`;
                if (!toRemove.has(key)) { toRemove.add(key); trackRemoval(key); }
              }
            }
        }
      }
    score += toRemove.size * 15;
    showEffect('彩色炸弹！');
    await removeAndCascade(toRemove);
    return;
  }

  // 彩虹 + 纸飞机 → 全场同色变纸飞机
  if (types.has(TYPE_RAINBOW) && types.has(TYPE_PLANE)) {
    const otherColor = t1.type === TYPE_RAINBOW ? t2.color : t1.color;
    toRemove.add(`${r1},${c1}`); toRemove.add(`${r2},${c2}`);
    trackRemoval(`${r1},${c1}`); trackRemoval(`${r2},${c2}`);
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++) {
        if (board[r][c].color === otherColor && board[r][c].obstacle === OBSTACLE_NONE) {
          const key = `${r},${c}`;
          if (!toRemove.has(key)) { toRemove.add(key); trackRemoval(key); }
          for (let dr = -1; dr <= 1; dr++)
            for (let dc = -1; dc <= 1; dc++) {
              const nr = r+dr, nc = c+dc;
              if (nr>=0&&nr<ROWS&&nc>=0&&nc<COLS) {
                const k = `${nr},${nc}`;
                if (!toRemove.has(k)) { toRemove.add(k); trackRemoval(k); }
              }
            }
        }
      }
    score += toRemove.size * 15;
    showEffect('彩色飞机！');
    await removeAndCascade(toRemove);
    return;
  }

  // 火箭 + 火箭 → 十字清除
  if ((types.has(TYPE_ROCKET_H) || types.has(TYPE_ROCKET_V)) && (types.has(TYPE_ROCKET_H) || types.has(TYPE_ROCKET_V))) {
    const midR = Math.round((r1 + r2) / 2);
    const midC = Math.round((c1 + c2) / 2);
    for (let i = 0; i < COLS; i++) {
      const key = `${midR},${i}`;
      if (!toRemove.has(key)) { toRemove.add(key); trackRemoval(key); }
    }
    for (let i = 0; i < ROWS; i++) {
      const key = `${i},${midC}`;
      if (!toRemove.has(key)) { toRemove.add(key); trackRemoval(key); }
    }
    score += toRemove.size * 15;
    showEffect('双重火箭！');
    await removeAndCascade(toRemove);
    return;
  }

  // 炸弹 + 炸弹 → 5x5
  if (types.has(TYPE_BOMB) && types.has(TYPE_BOMB)) {
    const midR = Math.round((r1 + r2) / 2);
    const midC = Math.round((c1 + c2) / 2);
    for (let dr = -2; dr <= 2; dr++)
      for (let dc = -2; dc <= 2; dc++) {
        const nr = midR+dr, nc = midC+dc;
        if (nr>=0&&nr<ROWS&&nc>=0&&nc<COLS) {
          const key = `${nr},${nc}`;
          if (!toRemove.has(key)) { toRemove.add(key); trackRemoval(key); }
        }
      }
    score += toRemove.size * 15;
    showEffect('双重炸弹！');
    await removeAndCascade(toRemove);
    return;
  }

  // 火箭 + 炸弹 → 3行3列
  if ((types.has(TYPE_ROCKET_H) || types.has(TYPE_ROCKET_V)) && types.has(TYPE_BOMB)) {
    const bombIs1 = t1.type === TYPE_BOMB;
    const br = bombIs1 ? r1 : r2;
    const bc = bombIs1 ? c1 : c2;
    for (let i = 0; i < COLS; i++)
      for (let dr = -1; dr <= 1; dr++) {
        const nr = br + dr;
        if (nr>=0&&nr<ROWS) {
          const key = `${nr},${i}`;
          if (!toRemove.has(key)) { toRemove.add(key); trackRemoval(key); }
        }
      }
    for (let i = 0; i < ROWS; i++)
      for (let dc = -1; dc <= 1; dc++) {
        const nc = bc + dc;
        if (nc>=0&&nc<COLS) {
          const key = `${i},${nc}`;
          if (!toRemove.has(key)) { toRemove.add(key); trackRemoval(key); }
        }
      }
    score += toRemove.size * 15;
    showEffect('火箭炸弹！');
    await removeAndCascade(toRemove);
    return;
  }

  // 纸飞机 + 纸飞机 → 3架飞机
  if (types.has(TYPE_PLANE) && types.has(TYPE_PLANE)) {
    toRemove.add(`${r1},${c1}`); toRemove.add(`${r2},${c2}`);
    trackRemoval(`${r1},${c1}`); trackRemoval(`${r2},${c2}`);
    const targets = findPlaneTargets(r1, c1, 3);
    for (const [tr, tc] of targets) {
      const key = `${tr},${tc}`;
      if (!toRemove.has(key)) { toRemove.add(key); trackRemoval(key); }
      for (let dr = -1; dr <= 1; dr++)
        for (let dc = -1; dc <= 1; dc++) {
          const nr = tr+dr, nc = tc+dc;
          if (nr>=0&&nr<ROWS&&nc>=0&&nc<COLS) {
            const k = `${nr},${nc}`;
            if (!toRemove.has(k)) { toRemove.add(k); trackRemoval(k); }
          }
        }
    }
    score += toRemove.size * 15;
    showEffect('双重飞机！');
    await removeAndCascade(toRemove);
    return;
  }

  // 火箭 + 纸飞机 → 飞机带着火箭飞
  if ((types.has(TYPE_ROCKET_H) || types.has(TYPE_ROCKET_V)) && types.has(TYPE_PLANE)) {
    const rocketIs1 = t1.type === TYPE_ROCKET_H || t1.type === TYPE_ROCKET_V;
    const rocketType = rocketIs1 ? t1.type : t2.type;
    const rr = rocketIs1 ? r1 : r2;
    const rc = rocketIs1 ? c1 : c2;
    toRemove.add(`${r1},${c1}`); toRemove.add(`${r2},${c2}`);
    trackRemoval(`${r1},${c1}`); trackRemoval(`${r2},${c2}`);
    // 火箭效果
    if (rocketType === TYPE_ROCKET_H) {
      for (let i = 0; i < COLS; i++) {
        const key = `${rr},${i}`;
        if (!toRemove.has(key)) { toRemove.add(key); trackRemoval(key); }
      }
    } else {
      for (let i = 0; i < ROWS; i++) {
        const key = `${i},${rc}`;
        if (!toRemove.has(key)) { toRemove.add(key); trackRemoval(key); }
      }
    }
    // 飞机飞向目标
    const targets = findPlaneTargets(r1, c1, 1);
    for (const [tr, tc] of targets) {
      const key = `${tr},${tc}`;
      if (!toRemove.has(key)) { toRemove.add(key); trackRemoval(key); }
      if (rocketType === TYPE_ROCKET_H) {
        for (let i = 0; i < COLS; i++) {
          const k = `${tr},${i}`;
          if (!toRemove.has(k)) { toRemove.add(k); trackRemoval(k); }
        }
      } else {
        for (let i = 0; i < ROWS; i++) {
          const k = `${i},${tc}`;
          if (!toRemove.has(k)) { toRemove.add(k); trackRemoval(k); }
        }
      }
    }
    score += toRemove.size * 15;
    showEffect('火箭飞机！');
    await removeAndCascade(toRemove);
    return;
  }

  // 炸弹 + 纸飞机 → 飞机带着炸弹飞
  if (types.has(TYPE_BOMB) && types.has(TYPE_PLANE)) {
    toRemove.add(`${r1},${c1}`); toRemove.add(`${r2},${c2}`);
    trackRemoval(`${r1},${c1}`); trackRemoval(`${r2},${c2}`);
    const targets = findPlaneTargets(r1, c1, 2);
    for (const [tr, tc] of targets) {
      for (let dr = -1; dr <= 1; dr++)
        for (let dc = -1; dc <= 1; dc++) {
          const nr = tr+dr, nc = tc+dc;
          if (nr>=0&&nr<ROWS&&nc>=0&&nc<COLS) {
            const key = `${nr},${nc}`;
            if (!toRemove.has(key)) { toRemove.add(key); trackRemoval(key); }
          }
        }
    }
    score += toRemove.size * 15;
    showEffect('炸弹飞机！');
    await removeAndCascade(toRemove);
    return;
  }
}

// ===================== 消除+障碍物处理+下落 =====================
async function removeAndCascade(toRemove, specialsToCreate = []) {
  // 消除动画
  for (const key of toRemove) {
    const [r, c] = key.split(',').map(Number);
    if (board[r][c] && board[r][c].el) board[r][c].el.classList.add('removing');
  }
  await sleep(300);

  // 处理障碍物：相邻消除会伤害障碍物
  const obstacleDamage = new Set(); // 需要扣血的障碍物位置
  for (const key of toRemove) {
    const [r, c] = key.split(',').map(Number);
    // 检查四周障碍物
    for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
      const nr = r+dr, nc = c+dc;
      if (nr>=0&&nr<ROWS&&nc>=0&&nc<COLS && board[nr][nc] && board[nr][nc].obstacle !== OBSTACLE_NONE) {
        obstacleDamage.add(`${nr},${nc}`);
      }
    }
    // 被消除的格子本身如果有障碍物也扣血
    if (board[r][c] && board[r][c].obstacle !== OBSTACLE_NONE) {
      obstacleDamage.add(`${r},${c}`);
    }
  }

  // 障碍物扣血
  for (const key of obstacleDamage) {
    const [r, c] = key.split(',').map(Number);
    const tile = board[r][c];
    if (!tile || tile.obstacle === OBSTACLE_NONE) continue;
    tile.hp--;
    if (tile.hp <= 0) {
      // 障碍物清除
      tile.obstacle = OBSTACLE_NONE;
      tile.hp = 0;
      score += 30;
      // 统计障碍物目标
      for (const obj of objectives) {
        if (obj.type === 'obstacle' && obj.done < obj.need) obj.done++;
      }
    }
    // 障碍物未清除但被损伤，方块本身保留（不清空）
  }

  // 清除非障碍物方块
  for (const key of toRemove) {
    const [r, c] = key.split(',').map(Number);
    if (board[r][c] && board[r][c].obstacle === OBSTACLE_NONE) {
      board[r][c] = null;
    }
  }

  // 放置特殊方块
  for (const sp of specialsToCreate) {
    // 强制放置：无论该位置当前状态如何
    board[sp.r][sp.c] = { color: sp.color, type: sp.type, obstacle: OBSTACLE_NONE, hp: 0, el: null };
  }

  dropAndFill();
  render();
  await sleep(300);
}

function dropAndFill() {
  for (let c = 0; c < COLS; c++) {
    const col = [];
    for (let r = ROWS - 1; r >= 0; r--) {
      if (board[r][c] !== null) col.push(board[r][c]);
    }
    while (col.length < ROWS) {
      col.push({ color: Math.floor(Math.random()*COLORS), type: TYPE_NORMAL, obstacle: OBSTACLE_NONE, hp: 0 });
    }
    for (let r = ROWS - 1; r >= 0; r--) {
      board[r][c] = col[ROWS - 1 - r];
    }
  }
}

// ===================== 动画 =====================
function showEffect(text) {
  const el = document.createElement('div');
  el.className = 'effect-text';
  el.textContent = text;
  boardEl.appendChild(el);
  setTimeout(() => el.remove(), 1200);
}

// 彩蛋：彩虹+彩虹触发，显示大爱心和名字
function showEasterEgg() {
  const overlay = document.createElement('div');
  overlay.className = 'easter-overlay';

  // 大爱心
  const heart = document.createElement('div');
  heart.className = 'easter-heart';
  heart.textContent = '💖';
  overlay.appendChild(heart);

  // 名字标签
  const namesDiv = document.createElement('div');
  namesDiv.className = 'easter-names';
  const displayNames = ['谢道标(💖)周微'];
  const nameColors = ['#ff6b9d'];
  displayNames.forEach((name, i) => {
    const span = document.createElement('span');
    span.className = 'name';
    span.textContent = name;
    span.style.color = nameColors[i];
    namesDiv.appendChild(span);
  });
  overlay.appendChild(namesDiv);

  // 副标题
  const subtitle = document.createElement('div');
  subtitle.className = 'easter-subtitle';
  subtitle.textContent = '肉肉 甜蜜暴击';
  overlay.appendChild(subtitle);

  document.body.appendChild(overlay);

  // 撒花粒子
  const colors = ['#e94560', '#4dabf7', '#ffe066', '#ff922b', '#cc5de8', '#7ed957'];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
    c.style.animationDelay = Math.random() * 1 + 's';
    c.style.animationDuration = (2 + Math.random() * 2) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4000);
  }

  setTimeout(() => overlay.remove(), 4000);
}

function showScorePop(r, c, pts) {
  const el = document.createElement('div');
  el.className = 'score-pop';
  el.textContent = `+${pts}`;
  const b = document.getElementById('board');
  const ts = parseFloat(getComputedStyle(b).getPropertyValue('--tile-size'));
  const gap = parseFloat(getComputedStyle(b).getPropertyValue('--gap'));
  el.style.left = c * (ts + gap) + 'px';
  el.style.top = r * (ts + gap) + 'px';
  boardEl.appendChild(el);
  setTimeout(() => el.remove(), 800);
}

// ===================== 关卡检查 =====================
function checkLevelEnd() {
  const allDone = objectives.every(o => o.done >= o.need);
  if (allDone) {
    showModal('恭喜过关！', `第${level}关完成`, `得分：${score}`, '下一关', () => {
      level++;
      init();
    });
  } else if (moves <= 0) {
    const remaining = objectives.filter(o => o.done < o.need).map(o => {
      if (o.type === 'color') return `${NAMES[o.color]}还差${o.need - o.done}`;
      return `障碍物还差${o.need - o.done}`;
    }).join('，');
    showModal('游戏结束', remaining, `得分：${score}`, '重新开始', () => {
      level = 1;
      init();
    });
  }
}

function showModal(title, desc, stats, btnText, callback) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-desc').textContent = desc;
  document.getElementById('modal-stats').textContent = stats;
  const btn = document.getElementById('modal-btn');
  btn.textContent = btnText;
  btn.onclick = () => { overlayEl.classList.remove('active'); callback(); };
  overlayEl.classList.add('active');
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ===================== 启动 =====================
init();
adjustBoardSize();
window.addEventListener('resize', adjustBoardSize);

function adjustBoardSize() {
  const maxW = Math.min(window.innerWidth - 40, 480);
  const avail = maxW - 7 * 4 - 2 * 12;
  const ts = Math.max(32, Math.min(56, Math.floor(avail / 8)));
  const b = document.getElementById('board');
  b.style.setProperty('--tile-size', ts + 'px');
  b.style.setProperty('--gap', Math.max(2, Math.floor(ts / 14)) + 'px');
}
